name: AI Clip Studio V24 - Knowledge Mode and One Minute Minimum

on:
  push:
    paths:
      - '.github/workflows/fix-v24.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-and-verify-v24:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout real project main branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install offline test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

