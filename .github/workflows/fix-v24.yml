          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V24_CHECK'
          from pathlib import Path
          root=Path('ai-clip-studio')
          html=(root/'site/index.html').read_text()
          app=(root/'app.py').read_text()
          js=(root/'site/app.js').read_text()
          assert 'data-val="15"' not in html and 'data-val="30"' not in html
          assert all(f'data-val="{s}"' in html for s in (60,90,120))
          assert 'สาระน่ารู้' in html
          assert 'length not in (60, 90, 120)' in app
          assert 'length not in (60,90,120)' in app
          assert 'install_v24(globals())' in app
          assert 'knowledgeSourcesList' in js
          print('V24 UI/backend settings verified')
          PY_V24_CHECK

      - name: Offline V24/V23/V22 regression checks (no Gemini key)
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_APP'
          import app
          assert app.APP_VERSION.startswith('v24-'), app.APP_VERSION
          assert app.app.state.v24_min_duration_seconds == 60
          assert tuple(app.app.state.v24_duration_options) == (60,90,120)
          assert app.app.state.v23_retry_installed if hasattr(app.app.state,'v23_retry_installed') else True
          assert any(getattr(route,'path',None)=='/api/v24/info' for route in app.app.routes)
          print('V24 successfully installed:',app.APP_VERSION)
          PY_APP

      - name: Commit only tested upgrade to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/v14_semantic.py ai-clip-studio/v11.py ai-clip-studio/v21_storyflow.py ai-clip-studio/v24_minute_knowledge.py ai-clip-studio/test_v24_minute_knowledge.py ai-clip-studio/test_v13_safety.py ai-clip-studio/Dockerfile ai-clip-studio/site/index.html ai-clip-studio/site/app.js
          if git diff --cached --quiet; then
            echo 'V24 already applied'
            exit 0
          fi
          git commit -m 'V24 knowledge mode Google grounding and minimum 60s video'
          git push origin HEAD:main
