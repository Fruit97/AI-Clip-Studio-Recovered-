      - name: Audit V34 strict transport safety and runtime installed hooks
        working-directory: ai-clip-studio
        run: |
          python -m compileall -q .
          node --check site/app.js
          python - <<'PY_AUDIT'
          import app,v27_replan as v27,v30_source_first as v30,v34_visual_refusal as v34
          assert app.APP_VERSION==v34.VERSION and app.app.state.v34_pretts_coverage_classification
          message=v34.PRE_VOICE_SOURCE_PREFIX+' | ตรวจภาพ: AI จับคู่หลักฐานภาพเบื้องต้นได้ 3/7 ประโยค'
          assert v27.is_visual_failure(RuntimeError(message))
          assert v30.need_deep_repair(RuntimeError(message))
          for err in ('Gemini API (429): quota exceeded','Gemini API (503)','Gemini TTS error','FFmpeg: bad file'):
              assert not v27.is_visual_failure(RuntimeError(err)),err
              assert not v30.need_deep_repair(RuntimeError(err)),err
          assert v30.TARGETS=={60:490,90:705,120:940}
          assert any(r.path=='/api/v34/info' for r in app.app.routes)
          print('Pre-TTS visual refusal now classified correctly on default as well as knowledge tone')
          PY_AUDIT
      - name: Full current-contract non-slow Python tests including V34
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q -m 'not slow' \
            --deselect=test_v11.py::test_full_mocked_pipeline_and_restart_checkpoint \
            --deselect=test_v14_semantic.py::test_prompt_does_not_use_hardcoded_sea_rule \
            --deselect=test_v14_semantic.py::test_ai_upload_only_called_once_and_marks_strict \
            --deselect=test_v17_quality.py::test_build_docker_covers_v17_and_static_cache \
            --deselect=test_v17_quality.py::test_gemini_analysis_cached_before_local_validation_failure \
            --deselect=test_v20_proxy.py::test_profiles \
            --deselect=test_v22_scene.py::test_preflight_removes_whole_unallocatable_sentences \
            --deselect=test_v25_adaptive.py::test_preflight_preserves_minute_when_source_supports \
            --deselect=test_v25_adaptive.py::test_preflight_does_not_drop_to_two_beats
