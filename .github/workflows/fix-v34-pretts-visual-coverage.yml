      - name: Keep V33 real 60-second MP4 after 5-of-14 and 3-of-5
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v33_end_to_end_mocked.py
      - name: Keep V32 source recovery MP4
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v32_end_to_end_mocked.py
      - name: Keep V31 3-anchored-shots MP4
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v31_end_to_end_mocked.py
      - name: Keep V30 60 90 120 MP4 and resume tests
        working-directory: ai-clip-studio
        timeout-minutes: 35
        run: python -m pytest -vv -s test_v30_end_to_end_mocked.py
      - name: Docker build plus actual V34 API HTTP smoke check
        timeout-minutes: 15
        run: |
          docker build -f ai-clip-studio/Dockerfile -t ai-clip-studio-v34 .
          docker run -d --name v34-smoke -p 10024:10000 ai-clip-studio-v34
          ready=0
          for i in $(seq 1 35); do
            if curl -fsS http://127.0.0.1:10024/api/v34/info -o /tmp/v34-info.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = '1' || { docker logs v34-smoke; exit 1; }
          python - <<'PY_CHECK_HTTP'
          import json
          x=json.load(open('/tmp/v34-info.json'))
          assert x['pre_voice_source_refusal_is_not_a_tts_or_quota_error']
          assert x['actual_http_tts_and_ffmpeg_errors_remain_fatal']
          print('Docker V34 endpoint ready and responds correctly')
          PY_CHECK_HTTP
          docker rm -f v34-smoke
      - name: Commit V34 to main ONLY after all steps pass
        run: |
          git status --short
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/test_v13_safety.py \
            ai-clip-studio/v34_visual_refusal.py ai-clip-studio/test_v34_visual_refusal.py \
            ai-clip-studio/test_v34_default_end_to_end_mocked.py
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V34 correct pre-TTS source refusal replan for default tone without quota misclassification'
          git push origin HEAD:main
