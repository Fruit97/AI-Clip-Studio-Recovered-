name: AI Clip Studio V34 - Pre-TTS Visual Coverage Bug and Real Default-Mode MP4 Gate

on:
  push:
    paths:
      - '.github/workflows/fix-v34-pretts-visual-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v34-only-after-all-regressions:
