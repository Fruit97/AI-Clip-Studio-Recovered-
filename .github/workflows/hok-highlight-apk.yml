name: HOK Highlight AI V8.4 APK
on:
  push:
    branches: [hok-highlight-apk-v7]
    paths:
      - 'hok-highlight-android/**'
      - '.github/workflows/hok-highlight-apk.yml'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'hok-highlight-android/**'
      - '.github/workflows/hok-highlight-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK (2026)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Configure Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Build signed debug APK and run unit tests
        run: gradle -p hok-highlight-android --no-daemon clean testDebugUnitTest assembleDebug --stacktrace
      - name: Verify APK exists and nonempty
        run: test -s hok-highlight-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: HOK-Highlight-AI-APK-V8-4
          path: hok-highlight-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download (push only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp hok-highlight-android/app/build/outputs/apk/debug/app-debug.apk HOK-Highlight-AI-Pad6-v8.4.apk
          if gh release view hok-highlight-ai-v8-4 >/dev/null 2>&1; then
            gh release upload hok-highlight-ai-v8-4 HOK-Highlight-AI-Pad6-v8.4.apk --clobber
          else
            gh release create hok-highlight-ai-v8-4 HOK-Highlight-AI-Pad6-v8.4.apk --target hok-highlight-apk-v7 --title 'HOK Highlight AI Pad6 v8.4' --notes 'V8.4: identical V8.3 kill recognition, 5-second before and 1-second after timeline, 720p 60fps MP4 export. Added Android foreground dataSync service, ongoing progress notification in Android shade and completion/error notification; supports use while in other apps and screen off. Android 13+ notifications permission required. Device testing still needed.'
          fi
