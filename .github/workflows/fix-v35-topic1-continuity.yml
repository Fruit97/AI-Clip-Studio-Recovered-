      - name: Audit version, installed hooks, safety and 412s long-take source logic
        working-directory: ai-clip-studio
        run: |
          python -m compileall -q .
          node --check site/app.js
          python - <<'PY_AUDIT_V35'
          import app,v35_continuity as m,v30_source_first as v30
          assert app.APP_VERSION==m.VERSION
          assert app.app.state.v35_contextual_source_editor
          assert any(getattr(r,'path',None)=='/api/v35/info' for r in app.app.routes)
          assert v30.TARGETS=={60:490,90:705,120:940}
          assert m.eligible_failure(RuntimeError('ลองวางบทจากภาพจริงอีกหนึ่งรอบแล้ว แต่ยังมีช่วงภาพที่ไม่รองรับ'))
          for err in ('Gemini API (429): quota','Gemini API (503)','FFmpeg: error','Gemini TTS error'):
              assert not m.eligible_failure(RuntimeError(err))
          print('V35 hooks, three target durations and actual transport error isolation: OK')
          PY_AUDIT_V35
          python -m pytest -q test_v35_continuity.py
      - name: Full active-contract Python suite including V35
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q -m 'not slow' \
            --deselect=test_v11.py::test_full_mocked_pipeline_and_restart_checkpoint \
            --deselect=test_v14_semantic.py::test_prompt_does_not_use_hardcoded_sea_rule \
            --deselect=test_v14_semantic.py::test_ai_upload_only_called_once_and_marks_strict \
            --deselect=test_v17_quality.py::test_build_docker_covers_v17_and_static_cache \
            --deselect=test_v17_quality.py::test_gemini_analysis_cached_before_local_validation_failure \
            --deselect=test_v20_proxy.py::test_profiles \
            --deselect=test_v22_scene.py::test_preflight_removes_whole_unallocatable_sentences \
            --deselect=test_v25_adaptive.py::test_preflight_preserves_minute_when_source_supports \
            --deselect=test_v25_adaptive.py::test_preflight_does_not_drop_to_two_beats
      - name: V35 real MP4 from short 65s camera take, initial 3/7 then 8/8 sparse matching
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v35_real_e2e.py
      - name: Preserve V34 default mode 3/7 MP4 and resume
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v34_default_end_to_end_mocked.py
      - name: Preserve V33 5/14 and 3/5 MP4
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v33_end_to_end_mocked.py
      - name: Preserve V32 source evidence MP4
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v32_end_to_end_mocked.py
      - name: Preserve V31 three-anchor visual MP4
        working-directory: ai-clip-studio
        timeout-minutes: 18
        run: python -m pytest -vv -s test_v31_end_to_end_mocked.py
      - name: Preserve V30 60 90 120 FPS and resume exact-frame regressions
        working-directory: ai-clip-studio
        timeout-minutes: 35
        run: python -m pytest -vv -s test_v30_end_to_end_mocked.py
      - name: Docker build and live V35 API smoke with HTTP 200
        timeout-minutes: 15
        run: |
          docker build -f ai-clip-studio/Dockerfile -t ai-clip-studio-v35 .
          docker run -d --name v35-smoke -p 10025:10000 ai-clip-studio-v35
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:10025/api/v35/info -o /tmp/v35-info.json; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = '1' || { docker logs v35-smoke; exit 1; }
          python - <<'PY_CHECK_V35'
          import json
          x=json.load(open('/tmp/v35-info.json'))
          assert x['sparse_source_context_mode'] and x['applies_to_all_narration_modes']
          assert x['zero_fabricated_narration_or_visual_matches']
          assert x['target_options']==[60,90,120]
          print('Actual V35 container responded HTTP 200 and truthfully reports all modes')
          PY_CHECK_V35
          docker rm -f v35-smoke
      - name: Commit V35 to main ONLY after every test passes
        run: |
          git status --short
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/test_v13_safety.py \
            ai-clip-studio/v35_continuity.py ai-clip-studio/test_v35_continuity.py \
            ai-clip-studio/test_v35_real_e2e.py
          git diff --cached --check
          git diff --cached --quiet && exit 1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V35 source-grounded same-take recovery from sparse visual evidence, all tones'
          git push origin HEAD:main
