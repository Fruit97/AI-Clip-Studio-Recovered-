name: AI Clip Studio V35 Topic 1 - AI Narration with Verified Continuous Source Takes

on:
  push:
    paths:
      - '.github/workflows/fix-v35-topic1-continuity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v35-only-after-full-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Checkout V34 source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and project dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest
      - name: Stage V35 source and tests after exact V34 version guards
        run: |
          python - <<'PY_INSTALL_V35'
          import json,zlib,base64,hashlib,ast
          from pathlib import Path
          root=Path('ai-clip-studio')
          app=root/'app.py'; docker=root/'Dockerfile'; safety=root/'test_v13_safety.py'
          a=app.read_text('utf8');d=docker.read_text('utf8');t=safety.read_text('utf8')
          assert a.count('install_v34_visual_refusal(globals())')==1 and 'install_v35_continuity(globals())' not in a, 'Expected V34 app only'
          assert d.count('v34_visual_refusal.py')==1 and 'v35_continuity.py' not in d, 'Unexpected Docker source'
