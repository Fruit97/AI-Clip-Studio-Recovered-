name: Deploy AI Clip Studio V15 One Minute

on:
  push:
    paths:
      - '.github/workflows/restore.yml'
      - 'AIClipStudio_V15_OneMinute_FullSource.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Extract complete V15 source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import stat

          root = Path.cwd().resolve()
          source = root / "AIClipStudio_V15_OneMinute_FullSource.zip"

          if not source.is_file():
              raise SystemExit("Upload V15 ZIP first")

          with ZipFile(source) as archive:
              names = set(archive.namelist())

              required = {
                  "ai-clip-studio/Dockerfile",
                  "ai-clip-studio/app.py",
                  "ai-clip-studio/v14_semantic.py",
                  "ai-clip-studio/v15_60seconds.py",
                  "ai-clip-studio/site/index.html",
                  "ai-clip-studio/site/app.js"
              }

              if not required.issubset(names):
                  raise SystemExit("Missing V15 project files")

              for item in archive.infolist():
                  target = (root / item.filename).resolve()

                  if not target.is_relative_to(root):
                      raise SystemExit("Unsafe ZIP path")

                  mode = item.external_attr >> 16
                  if stat.S_IFMT(mode) == stat.S_IFLNK:
                      raise SystemExit("Symlinks not allowed")

                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )
                      target.write_bytes(archive.read(item))

          print("V15 project restored")
          PY

      - name: Verify Python source
        shell: bash
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          files = sorted(Path("ai-clip-studio").glob("*.py"))

          for source in files:
              ast.parse(
                  source.read_text(encoding="utf-8"),
                  filename=str(source)
              )

          print("Python validation passed")
          PY

      - name: Commit V15 to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .dockerignore README-START-HERE.md ai-clip-studio

          if ! git diff --cached --quiet; then
            git commit -m "Upgrade AI Clip Studio V15 exact 60s"
            git push origin HEAD:main
          fi
          
