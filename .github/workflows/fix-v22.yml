name: AI Clip Studio V22 Verified Continuous Storyflow

on:
  push:
    paths:
      - '.github/workflows/fix-v22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies without calling Gemini
