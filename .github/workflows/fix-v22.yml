          app=root/'app.py'
          code=app.read_text('utf-8')
          required_marker='install_v21(globals())'
          if required_marker not in code:raise SystemExit('V21 installation is missing')
          addition='\n# V22: preserve continuous camera takes across synthetic partitions\nfrom v22_scene import install as install_v22\ninstall_v22(globals())\n'
          if 'install_v22(globals())' not in code:
              code+=addition
              app.write_text(code,encoding='utf-8')
          docker=root/'Dockerfile'
          d=docker.read_text('utf-8')
          if 'v22_scene.py' not in d:
              if 'v21_storyflow.py' not in d:
                  if 'v18_voice.py' not in d:raise SystemExit('Unexpected Dockerfile')
                  d=d.replace('v18_voice.py','v18_voice.py v20_proxy.py v21_storyflow.py',1)
              d=d.replace('v21_storyflow.py','v21_storyflow.py v22_scene.py',1)
              docker.write_text(d,encoding='utf-8')
          test=root/'test_v13_safety.py'
          t=test.read_text('utf-8')
          older="__import__('v21_storyflow').VERSION)"
          newer="__import__('v21_storyflow').VERSION, __import__('v22_scene').VERSION)"
          if newer not in t:
              if older not in t:raise SystemExit('Unexpected app version test')
              t=t.replace(older,newer,1)
              test.write_text(t,encoding='utf-8')
          for p in root.glob('*.py'):
              ast.parse(p.read_text('utf-8'),filename=p.name)
          print('V22 installed to Actions temporary checkout. Zero Gemini calls.')
          PY_V22

      - name: Test no-repeat, take merging, and safety regression
        run: |
          cd ai-clip-studio
          python -m pytest -q -m 'not slow'

      - name: Verify real MP4 with 39-second mocked narration
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[39.0]'

      - name: Verify real MP4 with 55-second mocked narration
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[55.0]'

      - name: Commit only after every offline test passes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/v22_scene.py ai-clip-studio/test_v22_scene.py ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/test_v13_safety.py
          if ! git diff --cached --quiet; then
            git commit -m 'V22 correct continuous shots and preflight voice footage capacity'
            git push origin HEAD:main
          fi
