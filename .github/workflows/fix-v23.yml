              'kGjTFDyygR7dkcDfsIugCDNqc6FJP63Jmnlg2tbC47jgyOqW86odMJLWteaP2MHuD9tABQ1x1s+s4m0kX9dmUGWp4eu7Gw9WWzOr+Y84IVXzWH',
              'Z7OuUizw7xAzIkDtHU74OjlmijnIKcln59O3U2kRRKk1sBkNGg786A0QoaXjEPXwF2wH86Mn8O9cTLfxKg4AiVENKwlLZXaI7V3+dzI8SNYmV3',
              '5TvKLE7+JIeFWHpCirw+gV5EULpBDj5FsghCpB4zrkB4LVhHNljjQNCIMaP/QMnWCNIgD1ktmB9irRclkW1uK1vL2Cpr+42l89gG+zWQhTWY77',
              'zZ7Q4GkMilwhvdb8OTkIU1NJo6HbM9229Tk9zyfwHP7FWZmaQQA1sfCkhlGj0dQJSr2OkvTIj00DXhjVstNaQiHFqfCgGicoaXYY+NKsuMVuLW',
              'FF0Xugwupvpybwy/EKbJfO/g/u2CEV',
          ]
          payload=json.loads(zlib.decompress(base64.b64decode(''.join(chunks))))
          if set(payload)!={'v23_retry.py','test_v23_retry.py'}:
              raise SystemExit('Unexpected V23 payload files')
          for filename, contents in payload.items():
              ast.parse(contents,filename=filename)
              (root/filename).write_text(contents,encoding='utf-8')
          app=root/'app.py'
          code=app.read_text('utf-8')
          if 'install_v22(globals())' not in code:
              raise SystemExit('V22 app installation missing; no changes committed')
          if 'install_v23(globals())' not in code:
              code+='\n# V23: bounded retry for explicit HTTP 503 on SCRIPT only\nfrom v23_retry import install as install_v23\ninstall_v23(globals())\n'
              app.write_text(code,'utf-8')
          v11=root/'v11.py'
          t=v11.read_text('utf-8')
          older="ns['executor'].submit(pipeline,jid,args['source'],'',api_key.strip(),args['opts'])"
          newer="ns['executor'].submit(ns['process'],jid,args['source'],'',api_key.strip(),args['opts'])"
          if newer not in t:
              if older not in t:
                  raise SystemExit('Unknown V11 resume implementation; refusing blind patch')
              t=t.replace(older,newer,1)
              v11.write_text(t,'utf-8')
          docker=root/'Dockerfile'
          d=docker.read_text('utf-8')
          if 'v23_retry.py' not in d:
              if 'v22_scene.py' not in d:raise SystemExit('Unknown Dockerfile')
              d=d.replace('v22_scene.py','v22_scene.py v23_retry.py',1)
              docker.write_text(d,'utf-8')
          safety_test=root/'test_v13_safety.py'
          st=safety_test.read_text('utf-8')
          old="__import__('v22_scene').VERSION)"
          new="__import__('v22_scene').VERSION, __import__('v23_retry').VERSION)"
          if new not in st:
              if old not in st:raise SystemExit('Unknown app version test; refusing patch')
              st=st.replace(old,new,1)
              safety_test.write_text(st,'utf-8')
          old_safety=root/'v13_safety.py'
          s=old_safety.read_text('utf-8')
          if "'max_retry_503':1" in s:
              s=s.replace("'max_retry_503':1", "'max_retry_503':ns['app'].state.retry_503_max_attempts",1)
              old_safety.write_text(s,'utf-8')
          elif "'max_retry_503':ns['app'].state.retry_503_max_attempts" not in s:
              raise SystemExit('Unknown V13 recovery info; refusing patch')
          for file in root.glob('*.py'):
              ast.parse(file.read_text('utf-8'),filename=str(file))
          print('V23 staged safely. No Gemini requests or API keys used.')
          PY_V23

      - name: Test entire offline regression suite (no Gemini API calls)
        run: |
          cd ai-clip-studio
          python -m pytest -q -m 'not slow'

      - name: Render simulated 39-second MP4 end-to-end
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[39.0]'

      - name: Render simulated 55-second MP4 end-to-end
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[55.0]'

      - name: Commit patch only when all offline tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/v23_retry.py ai-clip-studio/test_v23_retry.py ai-clip-studio/app.py ai-clip-studio/v11.py ai-clip-studio/Dockerfile ai-clip-studio/test_v13_safety.py ai-clip-studio/v13_safety.py
          if ! git diff --cached --quiet; then
            git commit -m 'V23 fix transient Gemini 503 at SCRIPT, preserve V22 resume pipeline'
            git push origin HEAD:main
          fi
