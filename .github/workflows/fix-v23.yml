name: AI Clip Studio V23 - Safe 503 Script Recovery

on:
  push:
    paths:
      - '.github/workflows/fix-v23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-then-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout actual project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Thai fonts and offline test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

      - name: Stage V23 recovery and repair resume pipeline
