name: AI Clip Studio V25 - Adaptive Evidence and Smooth Long Video

on:
  push:
    paths:
      - '.github/workflows/fix-v25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-before-install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout AI Clip Studio source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Thai font and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

