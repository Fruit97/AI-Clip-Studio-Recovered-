      - name: Verify Python and browser syntax
        shell: bash
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V25_VERIFY'
          from pathlib import Path
          root=Path('ai-clip-studio')
          app=(root/'app.py').read_text()
          v21=(root/'v21_storyflow.py').read_text()
          v22=(root/'v22_scene.py').read_text()
          v25=(root/'v25_adaptive.py').read_text()
          assert app.count('install_v25(globals())')==1
          assert "int(opts.get('length',60)) in (60, 90, 120)" in v21
          assert "int(opts.get('length',30)) in (60,90,120)" in v22
          assert 'mux_continuous_voice(result, result, context_voice, voice_duration)' in v21
          assert 'MAX_TAKE_EXTENSION = 12.0' in v25
          assert not any(f'data-val="{n}"' in (root/'site/index.html').read_text() for n in (15,30))
          print('V25 source and long-audio safeguards verified')
          PY_V25_VERIFY

      - name: Offline regression tests including V24-V22
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v25_adaptive.py test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_V25_APP'
          import app
          assert app.APP_VERSION.startswith('v25-'), app.APP_VERSION
          assert app.app.state.v25_adaptive_source_takes
          assert app.app.state.v24_min_duration_seconds==60
          assert app.app.state.v24_knowledge_grounding
          assert any(getattr(x,'path',None)=='/api/v25/info' for x in app.app.routes)
          print('Confirmed:', app.APP_VERSION)
          PY_V25_APP

      - name: Commit V25 only after tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/v22_scene.py ai-clip-studio/v25_adaptive.py ai-clip-studio/test_v25_adaptive.py ai-clip-studio/test_v13_safety.py ai-clip-studio/site/index.html
          if git diff --cached --quiet; then
            echo 'V25 already installed'
            exit 0
          fi
          git commit -m 'V25 improve verified source take coverage and 60-120s continuous narration'
          git push origin HEAD:main
