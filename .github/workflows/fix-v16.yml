name: Fix AI Clip Studio V16 Render

on:
  push:
    paths:
      - '.github/workflows/fix-v16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core
          ffmpeg -version
          ffprobe -version

      - name: Fix short video segments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ai-clip-studio/v11.py")
          source = path.read_text(encoding="utf-8")

          old = "    if not media_ok(dest, .12):raise RuntimeError('ส่วนวิดีโอที่ตัดต่อไม่สมบูรณ์')"

          new = """    # Accept valid short video segments.
              expected_min = min(.12, max(.067, float(duration) * .70))
              if not media_ok(dest, expected_min):
                  raise RuntimeError(
                      f'ส่วนวิดีโอที่ตัดต่อไม่สมบูรณ์: '
                      f'{float(duration):.3f} วินาที')"""

          old_cache = "        if not media_ok(output,.12):"
          new_cache = "        if not media_ok(output, min(.12, max(.067, float(s['duration']) * .70))):"

          if old in source:
              source = source.replace(old, new, 1)
          elif new not in source:
              raise SystemExit("Unexpected render validation code")

          if old_cache in source:
              source = source.replace(old_cache, new_cache, 1)
          elif new_cache not in source:
              raise SystemExit("Unexpected cache validation code")

          compile(source, str(path), "exec")
          path.write_text(source, encoding="utf-8")

          print("V16 patch applied successfully")
          PY

      - name: Test actual short MP4
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import subprocess
          import tempfile
          from pathlib import Path

          sys.path.insert(0, "ai-clip-studio")
          import v11

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              video = root / "input.mp4"
              voice = root / "voice.wav"

              subprocess.run([
                  "ffmpeg", "-v", "error", "-y",
                  "-f", "lavfi", "-i",
                  "testsrc2=size=320x180:rate=30:duration=2",
                  "-f", "lavfi", "-i",
                  "sine=frequency=300:sample_rate=24000:duration=2",
                  "-c:v", "libx264",
                  "-preset", "ultrafast",
                  "-threads", "1",
                  "-pix_fmt", "yuv420p",
                  "-c:a", "aac",
                  str(video)
              ], check=True)

              subprocess.run([
                  "ffmpeg", "-v", "error", "-y",
                  "-f", "lavfi", "-i",
                  "sine=frequency=400:sample_rate=24000:duration=2",
                  "-c:a", "pcm_s16le",
                  str(voice)
              ], check=True)

              ass = root / "subtitle.ass"
              output = root / "segment.mp4"

              v11.write_ass("Short clip", .10, ass)

              v11.render_one(
                  video, voice, output, ass,
                  {
                      "source_start": .2,
                      "voice_start": .2,
                      "duration": .10
                  },
                  True, True
              )

              assert v11.media_ok(output, .07)

              print("MP4 render test passed")
          PY

      - name: Save V16 fix to GitHub
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ai-clip-studio/v11.py

          if ! git diff --cached --quiet; then
            git commit -m "V16 fix short segment validation"
            git push origin HEAD:main
          fi
          
