      - name: Check source syntax and no-short-clips contract
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V29_CHECK'
          from pathlib import Path
          root=Path('ai-clip-studio')
          a=(root/'v14_semantic.py').read_text()
          d=(root/'v28_alignment.py').read_text()
          app=(root/'app.py').read_text()
          html=(root/'site/index.html').read_text()
          assert a.count('valid.sort(key=lambda e:(e[1] in used,-e[0]))')==1
          assert a.count('valid.sort(key=lambda e:(e[1] not in used,-e[0]))')==0
          assert 'original_evidence = copy.deepcopy(raw)' in d
          assert 'coverage_report(original_evidence, shots)' in d
          assert app.count('install_v29(globals())')==1
          assert 'V29 • CINEMATIC EDITORIAL' in html
          assert all(f'data-val="{x}"' in html for x in (60,90,120))
          assert not any(f'data-val="{x}"' in html for x in (15,30))
          print('Strict source guards, non-repeat preferences, full evidence snapshot and 60s minimum checked')
          PY_V29_CHECK
      - name: All regression tests (no Gemini API key)
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v29_verified_selection.py test_v28_alignment.py test_v27_replan.py test_v26_multishot.py test_v25_adaptive.py test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_V29_APP'
          import app
          assert app.APP_VERSION.startswith('v29-'),app.APP_VERSION
          assert app.app.state.v29_fresh_supported_shot_first
          assert app.app.state.v29_raw_evidence_audit_preserved
          assert app.app.state.v24_min_duration_seconds==60
          assert any(getattr(x,'path',None)=='/api/v29/info' for x in app.app.routes)
          print('V29 app import and guards succeeded')
          PY_V29_APP
      - name: Commit only after tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/v14_semantic.py ai-clip-studio/v28_alignment.py ai-clip-studio/v29_verified_selection.py ai-clip-studio/test_v29_verified_selection.py ai-clip-studio/test_v13_safety.py ai-clip-studio/site/index.html
          if git diff --cached --quiet; then echo 'V29 already installed'; exit 0; fi
          git commit -m 'V29 prefer unused grounded shots and preserve raw Gemini evidence for accurate diagnostics'
          git push origin HEAD:main
