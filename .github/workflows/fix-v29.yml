name: AI Clip Studio V29 - Fix Visual Match Priority and Evidence Audit

on:
  push:
    paths:
      - '.github/workflows/fix-v29.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-install-v29:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest
