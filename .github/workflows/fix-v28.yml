name: AI Clip Studio V28 - Knowledge Evidence Alignment and Diagnostics

on:
  push:
    paths:
      - '.github/workflows/fix-v28.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-install-v28:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
