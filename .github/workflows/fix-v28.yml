      - name: Check Python, JavaScript and source guarantees
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V28_VERIFY'
          from pathlib import Path
          root=Path('ai-clip-studio')
          app=(root/'app.py').read_text()
          semantic=(root/'v14_semantic.py').read_text()
          html=(root/'site/index.html').read_text()
          assert app.count('install_v28(globals())')==1
          assert app.index('install_v27(globals())')<app.index('install_v28(globals())')
          assert 'V28 • CINEMATIC EDITORIAL' in html
          assert all(f'data-val="{x}"' in html for x in (60,90,120))
          assert not any(f'data-val="{x}"' in html for x in (15,30))
          assert 'no more than 8 per beat' in semantic
          assert 'Only include matches scored at least 0.78' in semantic
          assert 'Never match merely because one word or ' in semantic
          assert 'For educational facts explicitly marked as externally verified' in semantic
          assert 'googleSearch' in (root/'v14_semantic.py').read_text()
          print('Confirmed source-grounded subject illustrations and >= 60s video restrictions')
          PY_V28_VERIFY

      - name: Run new unit tests and previous offline regression tests
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v28_alignment.py test_v27_replan.py test_v26_multishot.py test_v25_adaptive.py test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_V28_APP'
          import app
          assert app.APP_VERSION.startswith('v28-'),app.APP_VERSION
          assert app.app.state.v28_educational_visual_anchors
          assert app.app.state.v28_visual_audit_without_api_key
          assert app.app.state.v24_min_duration_seconds==60
          assert any(getattr(x,'path',None)=='/api/v28/info' for x in app.app.routes)
          print('Application V28 imported with existing safeguards')
          PY_V28_APP

      - name: Commit V28 to main only when all tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/v14_semantic.py ai-clip-studio/v28_alignment.py ai-clip-studio/test_v28_alignment.py ai-clip-studio/test_v13_safety.py ai-clip-studio/site/index.html
          if git diff --cached --quiet; then
            echo 'V28 already installed'
            exit 0
          fi
          git commit -m 'V28 align educational visual evidence and report actual source coverage'
          git push origin HEAD:main
