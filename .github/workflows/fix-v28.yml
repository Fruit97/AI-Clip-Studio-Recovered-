        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Thai fonts and test packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

