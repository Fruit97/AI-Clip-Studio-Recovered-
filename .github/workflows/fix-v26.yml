          for name,source in payload.items():
              ast.parse(source,filename=name)
              (out/name).write_text(source,encoding='utf-8')
          exec(compile(payload['install_v26.py'],'install_v26.py','exec'),{'__name__':'__main__'})
          PY_V26_STAGE

      - name: Verify all Python syntax and JS preserved
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V26_CHECK'
          from pathlib import Path
          r=Path('ai-clip-studio')
          app=(r/'app.py').read_text()
          assert app.count('install_v26(globals())')==1
          assert app.index('install_v25(globals())')<app.index('install_v26(globals())')
          assert (r/'site/index.html').read_text().count('V26 • CINEMATIC EDITORIAL')==1
          assert all(f'data-val="{x}"' in (r/'site/index.html').read_text() for x in (60,90,120))
          assert not any(f'data-val="{x}"' in (r/'site/index.html').read_text() for x in (15,30))
          assert 'v26_multishot.py' in (r/'Dockerfile').read_text()
          print('V26 source and min-60-second UI validated')
          PY_V26_CHECK

      - name: V26 + V25 + V24 offline regression tests
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v26_multishot.py test_v25_adaptive.py test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_V26_LIVE_IMPORT'
          import app
          assert app.APP_VERSION.startswith('v26-'),app.APP_VERSION
          assert app.app.state.v26_multi_verified_takes
          assert app.app.state.v26_drops_unallocatable_first_beat_if_safe
          assert app.app.state.v24_min_duration_seconds==60
          assert any(getattr(x,'path',None)=='/api/v26/info' for x in app.app.routes)
          print('App import succeeded:',app.APP_VERSION)
          PY_V26_LIVE_IMPORT

      - name: Save tested V26 to main branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/v26_multishot.py ai-clip-studio/test_v26_multishot.py ai-clip-studio/test_v13_safety.py ai-clip-studio/site/index.html
          if git diff --cached --quiet; then
            echo 'V26 already installed'
            exit 0
          fi
          git commit -m 'V26 edit verified multishot sentences; salvage valid opening; avoid 27 percent failure'
          git push origin HEAD:main
