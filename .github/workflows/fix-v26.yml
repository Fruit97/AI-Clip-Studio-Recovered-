name: AI Clip Studio V26 - Verified Multishot Storyflow Repair

on:
  push:
    paths:
      - '.github/workflows/fix-v26.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-install-v26:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout V25 source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

