name: AI Clip Studio V21 Natural Narration and Storyflow

on:
  push:
    paths:
      - '.github/workflows/fix-v21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout production project
        uses: actions/checkout@v4

      - name: Match production Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg and offline test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

