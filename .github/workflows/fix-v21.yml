          patches=json.loads(zlib.decompress(base64.b64decode(''.join(chunks))))
          required={'v21_storyflow.py','test_v21_storyflow.py','test_v21_end_to_end_mocked.py'}
          if set(patches)!=required: raise SystemExit('Unexpected patch payload')
          for name, content in patches.items():
              ast.parse(content,filename=name)
              (root/name).write_text(content,encoding='utf-8')

          app=root/'app.py'
          source=app.read_text('utf-8')
          marker='install_v20(globals())'
          if marker not in source: raise SystemExit('V20 must be deployed before installing V21')
          suffix='\n# V21: natural speech, story-first and no-replay video\nfrom v21_storyflow import install as install_v21\ninstall_v21(globals())\n'
          if 'install_v21(globals())' not in source:
              source+=suffix
          old_style='Natural friendly Thai narrator, clear pronunciation, measured documentary pace'
          new_style=('Authentic conversational Thai storyteller: lively but accurate, natural ordinary adult '
                     'speaking speed, fluent expressive rhythm, clear Thai, short purposeful pauses '
                     'only at the ends of sentences. No slow dramatic delivery, robotic cadence, '
                     'long silences, or exaggerated theatrical acting.')
          if old_style in source:
              source=source.replace(old_style,new_style,1)
          elif new_style not in source:
              raise SystemExit('Unexpected Gemini TTS style source')
          app.write_text(source,encoding='utf-8')

          docker=root/'Dockerfile'
          d=docker.read_text('utf-8')
          if 'v21_storyflow.py' not in d:
              if 'v20_proxy.py' not in d:raise SystemExit('Unexpected Dockerfile')
              d=d.replace('v20_proxy.py','v20_proxy.py v21_storyflow.py',1)
              docker.write_text(d,encoding='utf-8')

          index=root/'site/index.html'
          html=index.read_text('utf-8')
          if 'ความยาวเป้าหมาย (ให้ความสำคัญกับเสียงธรรมชาติ)' not in html:
              original='ความยาวคลิป (60 วินาทีแบบเป๊ะ)'
              if original not in html:raise SystemExit('Unexpected duration label')
              html=html.replace(original,'ความยาวเป้าหมาย (ให้ความสำคัญกับเสียงธรรมชาติ)',1)
              index.write_text(html,encoding='utf-8')

          test=root/'test_v13_safety.py'
          code=test.read_text('utf-8')
          needle="__import__('v20_proxy').VERSION)"
          replacement="__import__('v20_proxy').VERSION, __import__('v21_storyflow').VERSION)"
          if replacement not in code:
              if needle not in code:raise SystemExit('Unexpected current version test')
              code=code.replace(needle,replacement,1)
              test.write_text(code,encoding='utf-8')

          # Old end-to-end fixtures explicitly verify legacy exact-60 mode;
          # new V21 fixture verifies natural-speed 55s response and shot continuity.
          for name in ['test_v17_end_to_end_mocked.py','test_v18_end_to_end_mocked.py']:
              f=root/name
              code=f.read_text('utf-8')
              if "'editorial_v21':False" not in code:
                  anchor="'font_style':'bold'}"
                  if anchor not in code:raise SystemExit('Unexpected legacy fixture: '+name)
                  code=code.replace(anchor,"'font_style':'bold','editorial_v21':False}",1)
                  f.write_text(code,encoding='utf-8')

          for file in root.glob('*.py'):
              ast.parse(file.read_text('utf-8'),filename=str(file))
          print('V21 installed in staging; zero Gemini calls')
          PY_PATCH

      - name: Run offline regression suite
        run: |
          cd ai-clip-studio
          python -m pytest -q -m 'not slow'

      - name: Render actual V21 39-second MP4 with mocked Gemini
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[39.0]'

      - name: Render actual V21 55-second MP4 with mocked Gemini
        run: |
          cd ai-clip-studio
          python -m pytest -q 'test_v21_end_to_end_mocked.py::test_natural_speech_continuous_one_scene_per_sentence[55.0]'

      - name: Save only if both offline test groups pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/v21_storyflow.py ai-clip-studio/test_v21_storyflow.py ai-clip-studio/test_v21_end_to_end_mocked.py ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/site/index.html ai-clip-studio/test_v13_safety.py ai-clip-studio/test_v17_end_to_end_mocked.py ai-clip-studio/test_v18_end_to_end_mocked.py
          if ! git diff --cached --quiet; then
            git commit -m 'V21 story-first Thai narration, natural speed, forward-only scenes'
            git push origin HEAD:main
          fi
