name: AI Clip Studio V33 - Mixed Real-Model Evidence Recovery and Full MP4 Regression

on:
  push:
    paths:
      - '.github/workflows/fix-v33-evidence-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install-v33-after-all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout V32 project
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg, fonts, dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest
      - name: Install guarded V33 recovery from exact V32 source
        run: |
          python - <<'PY_V33_INSTALL'
          from pathlib import Path
          import zlib,base64,json,hashlib,ast
          root=Path('ai-clip-studio')
          app=root/'app.py';old=app.read_text('utf8')
          needle='from v32_recovery import install as install_v32_recovery\ninstall_v32_recovery(globals())'
          assert old.count(needle)==1 and 'install_v33_recovery' not in old, 'Exact V32 source required'
          docker=root/'Dockerfile';doc=docker.read_text('utf8')
          assert doc.count('v32_recovery.py')==1 and 'v33_recovery.py' not in doc
          safety=root/'test_v13_safety.py';t=safety.read_text('utf8')
          mark="__import__('v32_recovery').VERSION)"
          assert t.count(mark)==1,'Safety version marker changed'
          html=root/'site/index.html';h=html.read_text('utf8')
          assert h.count('V32 • CINEMATIC EDITORIAL')==1
          chunks=[
                        'eNrtPGmP48aVf4UYwyA5Q7El9TEz7GGQWTsOvIkPeCbOB7VAUFKpm25eYVHq7ggCYseAx9ldYD/YSGwvgnW8hhc2DGwcJ+n5N/1T9r1XVbylbm9mFwayc3SL',
