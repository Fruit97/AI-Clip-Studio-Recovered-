name: AI Clip Studio V30 - Full Source Coverage and Real MP4 Regression

on:
  push:
    paths:
      - '.github/workflows/fix-v30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-before-v30-install:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out existing project (do not overwrite previous versions)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg, Thai fonts and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest
