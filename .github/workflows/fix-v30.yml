      - name: Strict source, config and version checks
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_VALIDATE_V30'
          from pathlib import Path
          root=Path('ai-clip-studio')
          app=(root/'app.py').read_text('utf-8')
          proxy=(root/'v20_proxy.py').read_text('utf-8')
          semantic=(root/'v14_semantic.py').read_text('utf-8')
          html=(root/'site/index.html').read_text('utf-8')
          assert app.count('install_v30(globals())')==1
          assert app.index('install_v29(globals())')<app.index('install_v30(globals())')
          assert 'v30_source_first.py' in (root/'Dockerfile').read_text('utf-8')
          assert 'return [(False, 2, 384, 600), (True, 2, 384, 360)]' in proxy
          assert 'beats: 12-36 items' in semantic
          assert 'ONLY for actually observed candidate shot IDs used in visual_matches' in semantic
          assert 'V30 • CINEMATIC EDITORIAL' in html
          assert all(f'data-val="{s}"' in html for s in (60,90,120))
          assert not any(f'data-val="{s}"' in html for s in (10,15,20,30))
          print('Strict V30 safeguards verified')
          PY_VALIDATE_V30
      - name: Entire offline regression suite including source and audio tests
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q -m 'not slow'
          python - <<'PY_APP_V30'
          import app
          assert app.APP_VERSION.startswith('v30-'),app.APP_VERSION
          assert app.app.state.v30_source_coverage_first
          assert app.app.state.v30_extra_deep_analysis_max==1
          assert app.app.state.v30_no_extra_tts
          assert app.app.state.v24_min_duration_seconds==60
          assert any(getattr(route,'path',None)=='/api/v30/info' for route in app.app.routes)
          print('V30 app imports, route and minimal duration verified')
          PY_APP_V30
      - name: FULL END TO END - real MP4 render, mocked API, 60 90 and 120 seconds
        working-directory: ai-clip-studio
        timeout-minutes: 35
        run: |
          python -m pytest -vv -s test_v30_end_to_end_mocked.py
      - name: Commit verified files ONLY after all previous tests pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/site/index.html ai-clip-studio/test_v13_safety.py ai-clip-studio/v14_semantic.py ai-clip-studio/v20_proxy.py ai-clip-studio/v30_source_first.py ai-clip-studio/test_v30_source_first.py ai-clip-studio/test_v30_end_to_end_mocked.py
          if git diff --cached --quiet; then
            echo 'V30 already installed'; exit 0
          fi
          git commit -m 'V30 source-first 60-120s editorial plan with strict real MP4 regression'
          git push origin HEAD:main
