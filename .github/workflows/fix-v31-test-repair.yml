name: AI Clip Studio V31 - Accurate Three-Anchor MP4 Test Repair

on:
  push:
    paths:
      - '.github/workflows/fix-v31-test-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-install-v31:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout V30 source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install FFmpeg and project dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest
      - name: Install guarded V31 knowledge fallback
        run: |
          python - <<'PY_INSTALL_V31'
          from pathlib import Path
          import json,zlib,base64,ast,hashlib
          root=Path('ai-clip-studio')
          app=root/'app.py';old=app.read_text('utf-8')
          needle='from v30_render_reliability import install as install_v30_render\ninstall_v30_render(globals())'
          assert old.count(needle)==1 and 'install_v31_illustrative' not in old, 'V30 app source mismatch; no files changed'
          docker=root/'Dockerfile';d=docker.read_text('utf-8')
          assert d.count('v30_render_reliability.py')==1 and 'v31_illustrative.py' not in d, 'Docker version mismatch'
          safety=root/'test_v13_safety.py';sa=safety.read_text('utf-8')
          src="__import__('v30_source_first').VERSION)"
          assert sa.count(src)==1, 'Safety test version marker changed'
          html=root/'site/index.html';h=html.read_text('utf-8')
          assert h.count('V30 • CINEMATIC EDITORIAL')==1
          assert h.count('ไม่ทำเสียงช้า/วนฉาก')==1
