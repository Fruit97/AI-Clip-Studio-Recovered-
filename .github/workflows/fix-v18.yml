      - name: Real 60-second FFmpeg output from 39-second mocked Gemini TTS
        shell: bash
        run: |
          cd ai-clip-studio && python -m pytest -q test_v18_end_to_end_mocked.py
      - name: Commit only when both tests pass
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio
          if ! git diff --cached --quiet; then
            git commit -m 'V18 fix short narration without another Gemini API call'
            git push origin HEAD:main
          fi
