name: AI Clip Studio V32 - Correct Active V18 Script Budget and Full E2E Gate

on:
  push:
    paths:
      - '.github/workflows/fix-v32-contract-corrected.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-v32-only-after-media-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout exact V31 source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install FFmpeg, Noto Thai and project dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-thai-tlwg
          python -m pip install -r ai-clip-studio/requirements.txt pytest

      - name: Stage V32 source and tests with SHA256 and strict V31 version guards
        run: |
          python - <<'PY_INSTALL_V32'
          from pathlib import Path
          import json,zlib,base64,hashlib,ast
          root=Path('ai-clip-studio')
          app=root/'app.py';prev=app.read_text('utf8')
          needle='from v31_illustrative import install as install_v31_illustrative\ninstall_v31_illustrative(globals())'
          assert prev.count(needle)==1 and 'install_v32_recovery' not in prev, 'Expected unchanged V31 source; refuse to overwrite other updates'
          docker=root/'Dockerfile';d=docker.read_text('utf8')
          assert d.count('v31_illustrative.py')==1 and 'v32_recovery.py' not in d, 'Unexpected Dockerfile; abort rather than edit blindly'
          test=root/'test_v13_safety.py';t=test.read_text('utf8')
          mark="__import__('v31_illustrative').VERSION)"
          assert t.count(mark)==1, 'V31 version regression changed; refuse automated edit'
          html=root/'site/index.html';h=html.read_text('utf8')
          assert h.count('V31 • CINEMATIC EDITORIAL')==1, 'V31 UI did not match expected release'
