          assert all(v24.check_length(n)==n for n in (60,90,120))
          assert all(v24.output_gate(float(n),n) for n in (60,90,120))
          assert any(x.path=='/api/v32/info' for x in app.app.routes)
          print('V18 runtime 430-700 script range checked against V32 floor and V31 factual minimum; actual media gates unchanged')
          PY_CONTRACT

