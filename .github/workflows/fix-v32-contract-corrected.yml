          node --check site/app.js
          python - <<'PY_CONTRACT'
          import app
          import v17_quality as v17
          import v30_source_first as v30
          import v24_minute_knowledge as v24
          import v32_recovery as v32
          import v31_illustrative as v31
          assert app.APP_VERSION==v32.VERSION
          assert app.app.state.v32_visual_replan_recovery
          assert 0 < v17.MIN_CHARS < v32.PREFLIGHT_GLYPH_FLOORS[60] <= v17.MAX_CHARS
          assert v17.MIN_CHARS <= 600 <= v17.MAX_CHARS <= 850
          assert v31.MIN_SCORE>=.78
