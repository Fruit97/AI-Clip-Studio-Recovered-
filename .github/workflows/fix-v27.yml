      - name: Check source and JavaScript syntax
        run: |
          python -m compileall -q ai-clip-studio
          node --check ai-clip-studio/site/app.js
          python - <<'PY_V27_CHECK'
          from pathlib import Path
          root=Path('ai-clip-studio')
          app=(root/'app.py').read_text()
          assert app.count('install_v27(globals())')==1
          assert app.index('install_v26(globals())') < app.index('install_v27(globals())')
          assert 'v27_replan.py' in (root/'Dockerfile').read_text()
          html=(root/'site/index.html').read_text()
          assert 'V27 • CINEMATIC EDITORIAL' in html
          assert all(f'data-val="{d}"' in html for d in (60,90,120))
          assert not any(f'data-val="{d}"' in html for d in (15,30))
          print('V27 UI/runtime source guards passed')
          PY_V27_CHECK

      - name: Offline V27 and V22-26 regression tests without API key
        working-directory: ai-clip-studio
        run: |
          python -m pytest -q test_v27_replan.py test_v26_multishot.py test_v25_adaptive.py test_v24_minute_knowledge.py test_v23_retry.py test_v22_scene.py test_v13_safety.py
          python - <<'PY_V27_APP'
          import app
          assert app.APP_VERSION.startswith('v27-'),app.APP_VERSION
          assert app.app.state.v27_source_first_replan
          assert app.app.state.v27_max_extra_video_analysis == 1
          assert app.app.state.v24_min_duration_seconds==60
          assert any(getattr(r,'path',None)=='/api/v27/info' for r in app.app.routes)
          print('Imported V27 app and all endpoints successfully')
          PY_V27_APP

      - name: Commit tested V27 files to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai-clip-studio/app.py ai-clip-studio/Dockerfile ai-clip-studio/v27_replan.py ai-clip-studio/test_v27_replan.py ai-clip-studio/test_v13_safety.py ai-clip-studio/site/index.html
          if git diff --cached --quiet; then
            echo 'V27 already installed'
            exit 0
          fi
          git commit -m 'V27 source-first script repair with one cached reanalysis before TTS'
          git push origin HEAD:main
