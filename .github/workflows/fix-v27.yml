name: AI Clip Studio V27 - Repair Script from Verified Video Evidence

on:
  push:
    paths:
      - '.github/workflows/fix-v27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-then-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
